<style>
  :root {
    --belt-yellow:#e8c224; --belt-orange:#e8720a; --belt-green:#2a8a2a;
    --belt-blue:#1a5fb4; --belt-brown:#7a4a1a;
    --bg:#111; --bg2:#1a1a1a; --bg3:#242424;
    --border:rgba(255,255,255,0.08); --text:#f0f0f0; --text2:#999;
    --radius:12px; --accent:#e8720a;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; overscroll-behavior:none; }
  #app { display:flex; flex-direction:column; height:100dvh; }
  #header { flex-shrink:0; background:var(--bg2); border-bottom:1px solid var(--border); padding:12px 16px; position:sticky; top:0; z-index:100; }
  #header-top { display:flex; align-items:center; gap:12px; }
  #back-btn { display:none; background:none; border:none; color:var(--text); padding:4px 8px 4px 0; font-size:22px; cursor:pointer; line-height:1; }
  #header-title { font-size:17px; font-weight:600; flex:1; }
  #header-subtitle { font-size:12px; color:var(--text2); margin-top:2px; display:none; }
  #search-bar { margin-top:10px; display:none; }
  #search-input { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:10px; padding:9px 14px; color:var(--text); font-size:15px; outline:none; }
  #search-input::placeholder { color:var(--text2); }
  #content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #bottom-nav { flex-shrink:0; background:var(--bg2); border-top:1px solid var(--border); display:flex; padding:8px 0 max(8px,env(safe-area-inset-bottom)); }
  .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--text2); padding:4px 0; cursor:pointer; font-size:10px; transition:color 0.15s; }
  .nav-btn.active { color:var(--accent); }
  .nav-btn svg { width:24px; height:24px; }

  /* BELT CARDS */
  .belts-grid { padding:16px; display:flex; flex-direction:column; gap:12px; }
  .belt-card { background:var(--bg2); border-radius:var(--radius); border:1px solid var(--border); padding:18px 20px; display:flex; align-items:center; gap:16px; cursor:pointer; transition:background 0.15s; }
  .belt-card:active { background:var(--bg3); }
  .belt-stripe { width:6px; height:56px; border-radius:3px; flex-shrink:0; }
  .belt-info { flex:1; }
  .belt-name { font-size:18px; font-weight:700; }
  .belt-count { font-size:13px; color:var(--text2); margin-top:3px; }
  .belt-arrow { color:var(--text2); font-size:20px; }

  /* SECTIONS */
  .sections-list { padding:12px 16px; display:flex; flex-direction:column; gap:8px; }
  .section-item { background:var(--bg2); border-radius:10px; border:1px solid var(--border); overflow:hidden; }
  .section-header { padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .section-num { font-size:12px; font-weight:700; color:var(--text2); min-width:28px; }
  .section-title { flex:1; font-size:15px; font-weight:600; line-height:1.3; }
  .section-chevron { color:var(--text2); font-size:18px; transition:transform 0.2s; }
  .section-item.open .section-chevron { transform:rotate(90deg); }
  .section-body { display:none; padding:0 16px 16px; }
  .section-item.open .section-body { display:block; }
  .tech-item { padding:10px 12px; background:var(--bg3); border-radius:8px; margin-top:8px; cursor:pointer; display:flex; align-items:center; gap:10px; }
  .tech-item:active { opacity:0.75; }
  .tech-item-text { flex:1; }
  .tech-name { font-size:14px; font-weight:600; color:var(--text); margin-bottom:4px; }
  .tech-desc { font-size:13px; color:var(--text2); line-height:1.55; }
  .video-badge { flex-shrink:0; background:rgba(232,114,10,0.18); border:1px solid rgba(232,114,10,0.35); border-radius:6px; padding:3px 7px; font-size:11px; font-weight:700; color:var(--accent); white-space:nowrap; }

  /* DETAIL */
  .detail-view { padding:16px; }
  .detail-tech-block { background:var(--bg2); border-radius:var(--radius); border:1px solid var(--border); padding:16px; margin-bottom:12px; }
  .detail-tech-num { font-size:12px; font-weight:700; margin-bottom:6px; }
  .detail-tech-title { font-size:18px; font-weight:700; margin-bottom:10px; }
  .detail-tech-desc { font-size:14px; color:#ccc; line-height:1.65; }

  /* VIDEO PLAYER */
  .video-section { margin-bottom:12px; }
  .video-placeholder { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:32px 16px; text-align:center; color:var(--text2); font-size:13px; }
  .video-placeholder-icon { font-size:32px; margin-bottom:8px; }
  .video-placeholder-file { font-size:11px; font-family:monospace; background:var(--bg3); padding:4px 8px; border-radius:4px; margin-top:8px; color:var(--text2); word-break:break-all; }
  .video-wrapper { background:#000; border-radius:var(--radius); overflow:hidden; position:relative; }
  .video-wrapper video { width:100%; display:block; max-height:260px; background:#000; }
  .video-filename { font-size:11px; color:var(--text2); text-align:center; margin-top:6px; font-family:monospace; }

  /* OTHER TECHS */
  .other-tech-item { background:var(--bg2); border-radius:10px; border:1px solid var(--border); padding:14px 16px; margin-bottom:8px; cursor:pointer; display:flex; align-items:center; gap:10px; }
  .other-tech-item:active { background:var(--bg3); }

  /* SEARCH */
  .search-results { padding:12px 16px; }
  .search-result-item { background:var(--bg2); border-radius:10px; border:1px solid var(--border); padding:14px 16px; margin-bottom:8px; cursor:pointer; }
  .search-result-item:active { background:var(--bg3); }
  .sr-belt { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
  .sr-section { font-size:13px; color:var(--text2); margin-bottom:3px; }
  .sr-tech { font-size:15px; font-weight:600; }
  .sr-snippet { font-size:13px; color:var(--text2); margin-top:4px; line-height:1.4; }
  .sr-has-video { font-size:11px; font-weight:700; color:var(--accent); margin-top:5px; }
  mark { background:rgba(232,114,10,0.3); color:var(--text); border-radius:2px; padding:0 1px; }
  .no-results { text-align:center; padding:40px 16px; color:var(--text2); font-size:15px; }

  /* HOME */
  .home-hero { padding:24px 16px 8px; }
  .home-title { font-size:28px; font-weight:800; line-height:1.1; }
  .home-sub { font-size:15px; color:var(--text2); margin-top:6px; }
  .stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; padding:16px; }
  .stat-card { background:var(--bg2); border-radius:10px; border:1px solid var(--border); padding:14px 12px; text-align:center; }
  .stat-num { font-size:26px; font-weight:800; }
  .stat-label { font-size:11px; color:var(--text2); margin-top:2px; }
  .home-section-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; color:var(--text2); padding:4px 16px 8px; }
  .tip-block { background:rgba(232,114,10,0.08); border:1px solid rgba(232,114,10,0.2); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .tip-label { font-size:11px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
  .tip-text { font-size:13px; color:var(--text2); line-height:1.5; }
  .exam-badge { display:inline-block; background:rgba(232,114,10,0.15); color:var(--accent); border:1px solid rgba(232,114,10,0.3); border-radius:6px; font-size:11px; font-weight:700; padding:2px 8px; margin-top:8px; }
</style>
</head>

        { n:'2', name:'Juji gatame inverso', video:'verde_14_2.mp4', desc:'Come la 1 ma aggressore oppone resistenza dal suo lato. Io lo assecondo ed eseguo la leva sul fianco o in posizione prona.' },
        { n:'3', name:'Strappo trachea, ginocchio su gomito', video:'verde_14_3.mp4', desc:'Con mano più vicina all\'aggressore, seguo la trachea fino ad afferrare le ghiandole linfatiche. L\'altra mano afferra la mano dell\'aggressore più esterna, ruoto e mi libero. Il mio ginocchio più vicino al corpo dell\'aggressore va sul suo plesso brachiale.' },
        { n:'4', name:'Immobilizzazione da judo', video:'verde_14_4.mp4', desc:'L\'aggressore esegue l\'immobilizzazione da Judo. Leva sulla spina del naso, ruoto e mi libero.' }

        { n:'2', name:'Con presa al busto', video:'blu_3_2.mp4', desc:'Apri dall\'interno. Con sx afferra sua dx, colpo allo stomaco, poi avvolgi il suo busto con il braccio destro avvicinandoti e ruotando. Nella rotazione abbassati, una volta stabilito il contatto proiettalo sollevandolo, sfruttando la forza delle gambe.' },
        { n:'3', name:'Con presa su stesso braccio', video:'blu_3_3.mp4', desc:'Apri internamente, gomitata allo stomaco, una mano afferra il polso, il braccio omolaterale va sotto l\'ascella. Appoggia la schiena su sua pancia abbassandoti. Proietta sollevandoti e ruotando il busto. Tieni sempre il braccio dell\'aggressore. Immobilizza.' }

      { title:'Difesa da minaccia con coltello', items:[

        { n:'2A', name:'Coltello alla gola - lato prono', video:'blu_8_2.mp4', desc:'Come da difesa da presa alla maglia: afferra sua mano con coltello con mano speculare bloccandola sul petto (mano a pappagallo). Contemporaneamente colpo al viso, afferra la spalla, ginocchiate, raddoppia su coltello e fai leva n.4 (Kote Gaeshi). Porta a terra e immobilizza.' },
        { n:'2B', name:'Coltello alla gola - lato supino', video:'blu_8_3.mp4', desc:'Con mano OPPOSTA a quella dell\'aggressore afferra la sua mano armata e spingila verso il basso, ruotando il busto. Con il braccio più distante colpisci il viso e torna sul coltello, raddoppia la presa, leva 4.' },
        { n:'3A', name:'Coltello alla gola centrale - una mano', video:'blu_8_4.mp4', desc:'Con mano speculare afferra la sua mano con coltello e spingi verso il basso avvicinandoti lateralmente, colpi al viso.' },
        { n:'3B', name:'Coltello alla gola centrale - due mani', video:'blu_8_5.mp4', desc:'Afferra con due mani la mano con coltello e bloccala sul petto tirando indietro la testa. Contemporaneamente calcio o ginocchiata (movimento a pendolo).' },
        { n:'4A', name:'Da dietro alla schiena - interna', video:'blu_8_6.mp4', desc:'Ruota internamente rimanendo a contatto con il braccio dell\'aggressore. Con il braccio passa sopra al suo e immobilizza avvicinandoti. Contemporaneamente colpo al volto, afferra la spalla, ginocchiate tenendo sempre focus sul coltello. Quando è ammorbidito fai leva e porta a terra.' },
        { n:'4B', name:'Da dietro alla schiena - esterna', video:'blu_8_7.mp4', desc:'Ruota esternamente, aggancia suo braccio mantenendo il controllo del coltello, colpisci il collo da dietro, afferra testa e falla ruotare dal lato opposto al tuo, mantieni la sua schiena inarcata e il suo braccio teso.' },
        { n:'5', name:'Da dietro alla gola', video:'blu_8_8.mp4', desc:'Come da difesa da strangolamento con avambraccio. Afferra coltello con due mani (stabilizza il baricentro, gira un po\' il bacino per creare spazio) e colpisci con mano interna i testicoli ripetutamente. Ruota internamente ed esci dal suo braccio, dai ginocchiata. Tieni sempre il coltello aderente al petto. Leva al polso/disarmo/porta a terra.' },
        { n:'6 prona', name:'A terra - mano prona', video:'blu_8_9.mp4', desc:'Con mano speculare afferra coltello e contemporaneamente colpisci al viso con altra mano, raddoppia sul coltello. Immobilizza la mano, colpisci il viso. Con la gamba dai spinta alla gamba di appoggio e ruota piegando il ginocchio per farlo andare in leva. MORDI la mano per disarmare.' },
        { n:'6 supina', name:'A terra - mano supina', video:'blu_8_10.mp4', desc:'Afferra il coltello con entrambe le mani e portalo dal lato opposto del braccio. A) Tieni il coltello al petto e ruota il busto, calcio sulla gamba di appoggio, aggancia il collo e porta il braccio in leva. MORDI per disarmare. B) Spingi il coltello fino a terra, appoggia di peso il corpo per tenerlo fermo.' }
      ]},
      { title:'Difesa da coltellata', items:[
        { n:'1A', name:'Rompighiaccio - uscita A', video:'blu_9_1.mp4', desc:'Aggressore attacca con dx: con avambraccio sx blocca suo braccio con coltello, mantieni contatto spingendo, scivola con mano aperta fino ad arrivare al polso. Contemporaneamente colpo al viso con dx e afferra la spalla. Parti con ginocchiate, poi raddoppia la presa afferrando le nocche, calcio e disarma con cavaliere.' },
        { n:'1B', name:'Rompighiaccio - uscita B', video:'blu_9_2.mp4', desc:'Leggera rotazione interna: avanza ruotando verso il braccio che ti aggredisce. La gamba con cui avanzi è dello stesso lato del braccio con cui vieni aggredito.' },
        { n:'2', name:'Da basso vs alto', video:'blu_9_3.mp4', desc:'Parata 6, afferra suo braccio con coltello e tira ginocchiate. Non mollare mai il braccio. Devi avere il controllo sull\'avambraccio. Usa il peso del corpo. Dopo 3/4 ginocchiate porta in leva e a terra. Disarma con cavaliere o con leva.' },
        { n:'3', name:'Stilettata', video:'blu_9_4.mp4', desc:'Da posizione naturale. Esci esternamente, colpendo con avambraccio speculare il suo avambraccio dall\'alto verso il basso. Mantieni il contatto, scivola verso il braccio fino ad arrivare al polso, afferra e contemporaneamente dai un pugno al viso. Raddoppia la presa e fai leva 4.' },
        { n:'4', name:'Marsigliese', video:'blu_9_5.mp4', desc:'Arretra per schivare e avanza con passo, un solo colpo (tanti colpi = errore), raddoppia la presa, calcio e leva (koto goeshi).' }

      { title:'Difesa da bastone', items:[
        { n:'1', name:'Bastonata alta - imbuto interno', video:'blu_11_1.mp4', desc:'Bastonata dall\'alto a una mano. Braccio dal lato dell\'attacco ad "imbuto" per far scivolare il bastone - testa sotto al braccio. Contemporaneamente colpisci al viso avanzando. Abbraccia il bastone passando dall\'alto, afferra la spalla e dai ginocchiate. Una volta con entrambe le mani sul bastone ruota il bacino per fargli mollare la presa. Dai tre bastonate.' },
        { n:'2', name:'Bastonata alta - imbuto interno 2', video:'blu_11_2.mp4', desc:'Come la 1 ma successivamente scivola su suo braccio mantenendo il controllo. Afferra la punta del bastone con palmo verso l\'alto e disarma con movimento del bacino. Con parte corta del bastone colpo al viso, poi strangolamento (bastone dietro al collo). Calcio dietro al ginocchio.' },
        { n:'3', name:'Bastonata alta a 2 mani dall\'alto', video:'blu_11_3.mp4', desc:'Avversario impugna a 2 mani: avvicinati con braccia ad imbuto a 2 mani e testa tra le braccia. Blocca con entrambe le mani prima che ricarichi: A) tieni con la mano più vicina e colpisci con l\'altra. B) come A + ginocchiata alle mani. C) blocca con la mano più lontana e colpisci con l\'avambraccio alla mandibola esterna.' },
        { n:'4A', name:'Bastonata laterale - leva al gomito', video:'blu_11_4.mp4', desc:'Avanza diagonalmente con parata in seconda guardia, gomiti che si toccano. Afferra le braccia e portale al petto, colpi vari. Leva al gomito: dx sopra al suo gomito dx e raddoppia con sx, porta a terra.' },

      { title:'Difesa da presa da dietro tipo Nelson', items:[
        { n:'1', name:'Tentativo di Nelson', video:'blu_13_1.mp4', desc:'Quando sta tentando di afferrarti ma ha ancora gli avambracci sui tuoi fianchi, immobilizza stringendo le braccia, colpi alle tibie e pestoni. Con dx afferra suo polso sx (palmo verso l\'alto), con sx afferra le sue dita (pollice in giù) e rompile verso l\'esterno, ruota strisciando il gomito su suo sterno e portalo a terra con le sue dita. Immobilizza.' },
        { n:'2', name:'Nelson chiusa', video:'blu_13_2.mp4', desc:'Afferra i suoi pollici con le dita (mano a pappagallo) e fai leva. Una volta liberato dalla presa mantieni in leva una delle sue due mani e con l\'altra colpisci.' },

        { n:'3', name:'Da davanti con due mani C', video:'blu_14_3.mp4', desc:'Afferra sua mano con mano speculare, pugno sul plesso brachiale, aggancia il suo braccio e proietta (proiezione con entrambe le mani sotto lo stesso braccio).' },

  {
    id:'marrone', name:'Cintura Marrone', color:'#7a4a1a',
    sections:[
      { title:'Difesa da pistola', items:[
        { n:'1', name:'Frontale alla testa', video:'marrone_1_1.mp4', desc:'Afferra la canna con i pollici al castelletto del grilletto, contemporaneamente togliti dalla linea di tiro abbassandoti e distendendo le braccia, calcio ai testicoli con la gamba esterna, passo in avanti facendo leva a 30° tenendo la pistola, sfila tirando verso di te, arma e punta.' },
        { n:'2', name:'Frontale al petto', video:'marrone_1_2.mp4', desc:'Da posizione naturale difensiva, alza le mani all\'altezza della pistola. Ruota esternamente sul posto afferrando la pistola dal carrello (se possibile farlo scorrere per bloccare il colpo) e spostala verso il basso. Passo in avanti rimanendo esterno all\'avversario e pressione sull\'avambraccio, contemporaneamente pugno al viso. Afferra la pistola dalla culatta passando da sotto stando fuori dalla linea di tiro, ruota per rompere il dito sul grilletto, allontanati, arma e mira.' },
        { n:'3', name:'Frontale testa - variante', video:'marrone_1_3.mp4', desc:'Con un movimento unico afferra la canna con mano interna, mano esterna va sul polso, ruota la testa per uscire dalla linea di tiro e porta la pistola verso il basso. Con il braccio spingi il suo braccio tenendolo in tensione e sfila la pistola per torsione. DEVI SEMPRE AVERE IL CONTROLLO DELLA LINEA DI TIRO.' },
        { n:'4', name:'Laterale alla tempia (verso occhio)', video:'marrone_1_4.mp4', desc:'Afferra la canna con la mano più vicina passando dietro e come difesa frontale al petto.' },
        { n:'5A', name:'Laterale alla tempia (verso nuca) A', video:'marrone_1_5.mp4', desc:'Se alzando le mani il braccio più vicino all\'aggressore va dietro alla pistola, con il braccio più vicino ruota e afferra da sotto, spostati con il volto dalla linea di tiro, blocco al petto con l\'avambraccio, colpisci con mano libera e disarma dalla canna.' },
        { n:'5B', name:'Laterale alla tempia (verso nuca) B', video:'marrone_1_6.mp4', desc:'Se alzando le mani rimangono entrambe davanti alla pistola, passa da sopra con il braccio mentre ruoti il volto verso la pistola per spostarti dalla linea di tiro.' },
        { n:'6', name:'Laterale al fianco (verso rene)', video:'marrone_1_7.mp4', desc:'Mezzo passo verso di lui e braccio indietro per spostare la linea di tiro, afferra da sotto e poi come 5.' },
        { n:'7', name:'Laterale al fianco (verso la pancia)', video:'marrone_1_8.mp4', desc:'Colpetto di braccio avanti, mezzo passo indietro e poi disarmo tipo cavaliere.' },
        { n:'8', name:'Da dietro alla nuca - braccio teso', video:'marrone_1_9.mp4', desc:'Rotazione veloce interna della testa, afferra da sotto e colpi al viso (maglietta). Importante il blocco al petto della mano armata.' },
        { n:'9A', name:'Da dietro alla schiena A', video:'marrone_1_10.mp4', desc:'Controlla con che mano tiene la pistola, rotazione veloce interna, afferra da sotto e colpi al viso (maglietta). Importante il blocco al petto della mano armata.' },
        { n:'9B', name:'Da dietro alla schiena B', video:'marrone_1_11.mp4', desc:'Controlla con che mano tiene la pistola, ruota internamente, passando da sopra immobilizza, colpisci (pugno girando, afferra spalla, testata, ginocchiata, pugno su avambraccio, pugno in faccia).' },
        { n:'10', name:'Da dietro alla tempia con blocco del collo (mano dx)', video:'marrone_1_12.mp4', desc:'Afferra la canna della pistola da sopra e contemporaneamente la testa va indietro, tira in avanti raddoppiando con mano sx su calcio della pistola, spingi con il sedere indietro e disarma. Una volta disarmato dai una gomitata al corpo, scappa armando e puntando.' },
        { n:'11', name:'Da dietro alla tempia con mano sul collo (mano sx)', video:'marrone_1_13.mp4', desc:'Con la mano opposta a quella con cui tiene la pistola afferra la canna da sopra, sposta la testa, afferra il tuo polso e ruota, disarma. Nella rotazione spacca il dito.' },

// ---STATO ---
let currentTab = 'home';
let currentBelt = null;
let navStack = [];

// ---HELPERS ---
function getTotalTechs() {
  return BELTS.reduce((t,b) => t + b.sections.reduce((s,sec) => s + sec.items.length, 0), 0);
}
function getTotalWithVideo() {
  return BELTS.reduce((t,b) => t + b.sections.reduce((s,sec) => s + sec.items.filter(i=>i.video).length, 0), 0);
}

// ---TAB NAV ---
function showTab(tab) {
  currentTab = tab;
  ['home','belts','search'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
  });
  document.getElementById('search-bar').style.display = tab==='search' ? 'block' : 'none';
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('header-subtitle').style.display = 'none';
  currentBelt = null;
  navStack = [];
  if (tab==='home') { document.getElementById('header-title').textContent='Krav Maga'; renderHome(); }
  else if (tab==='belts') { document.getElementById('header-title').textContent='Cinture'; renderBelts(); }
  else if (tab==='search') {
    document.getElementById('header-title').textContent='Cerca';
    renderSearchEmpty();
    setTimeout(()=>document.getElementById('search-input').focus(),100);
  }
}

// ---HOME ---
function renderHome() {
  const total = getTotalTechs();
  const totalSec = BELTS.reduce((t,b) => t+b.sections.length, 0);
  const totalVid = getTotalWithVideo();
  document.getElementById('content').innerHTML = `
    <div class="home-hero">
      <div class="home-title">Programmi<br>Tecnici 2025</div>
      <div class="home-sub">Street Self Defence Method · Krav Maga<br>Mauro Chieregati</div>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" style="color:var(--accent)">${BELTS.length}</div><div class="stat-label">Cinture</div></div>
      <div class="stat-card"><div class="stat-num">${totalSec}</div><div class="stat-label">Sezioni</div></div>
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Tecniche</div></div>
    </div>
    <div class="home-section-title">Programmi</div>
    <div class="belts-grid" style="padding-top:0">
      ${BELTS.map(b=>`
        <div class="belt-card" onclick="openBelt('${b.id}')">
          <div class="belt-stripe" style="background:${b.color}"></div>
          <div class="belt-info">
            <div class="belt-name">${b.name}</div>
            <div class="belt-count">${b.sections.length} sezioni · ${b.sections.reduce((t,s)=>t+s.items.length,0)} tecniche</div>
            ${b.id==='marrone'?'<div class="exam-badge">Esame avanzato</div>':''}
          </div>
          <div class="belt-arrow">›</div>
        </div>
      `).join('')}
    </div>
    <div style="height:16px"></div>
  `;
}

// ---BELT LIST ---
function renderBelts() {
  document.getElementById('content').innerHTML = `
    <div class="belts-grid">
      ${BELTS.map(b=>`
        <div class="belt-card" onclick="openBelt('${b.id}')">
          <div class="belt-stripe" style="background:${b.color}"></div>
          <div class="belt-info">
            <div class="belt-name">${b.name}</div>
            <div class="belt-count">${b.sections.length} sezioni · ${b.sections.reduce((t,s)=>t+s.items.length,0)} tecniche</div>
          </div>
          <div class="belt-arrow">›</div>
        </div>
      `).join('')}
    </div>
  `;
}

// ---OPEN BELT ---
function openBelt(beltId) {
  const belt = BELTS.find(b=>b.id===beltId);
  if (!belt) return;
  currentBelt = belt;
  navStack = [{type:'belt', id:beltId}];
  document.getElementById('back-btn').style.display='block';
  document.getElementById('header-title').textContent=belt.name;
  const sub = document.getElementById('header-subtitle');
  sub.textContent=`${belt.sections.length} sezioni`;
  sub.style.display='block';
  renderSections(belt);
}

function renderSections(belt) {
  let html = '<div class="sections-list">';
  if (belt.tips && belt.tips.length) {
    html += `<div class="tip-block"><div class="tip-label">⚡ Principi chiave</div>${belt.tips.map(t=>`<div class="tip-text">• ${t}</div>`).join('')}</div>`;
  }
  belt.sections.forEach((sec,si)=>{
    const vidCount = sec.items.filter(i=>videoReady(i.video)).length;
    html += `
      <div class="section-item" id="sec-${si}">
        <div class="section-header" onclick="toggleSection(${si})">
          <div class="section-num">${String(si+1).padStart(2,'0')}</div>
          <div class="section-title">${sec.title}</div>
          ${vidCount>0 ? `<div style="font-size:11px;color:var(--accent);margin-right:4px">▶ ${vidCount}</div>` : ''}
          <div class="section-chevron">›</div>
        </div>
        <div class="section-body">
          ${sec.items.map((item,ii)=>`
            <div class="tech-item" onclick="openTech('${belt.id}',${si},${ii})">
              <div class="tech-item-text">
                ${item.n ? `<div class="tech-name">${item.n}. ${item.name}</div>` : `<div class="tech-name">${item.name}</div>`}
                <div class="tech-desc">${item.desc.length>110 ? item.desc.substring(0,110)+'…' : item.desc}</div>
              </div>
              ${videoReady(item.video) ? '<div class="video-badge">▶ VIDEO</div>' : ''}
            </div>
          `).join('')}
        </div>
      </div>
    `;
  });
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function toggleSection(si) {
  const el = document.getElementById('sec-'+si);
  el.classList.toggle('open');
  if (el.classList.contains('open')) {
    document.getElementById('content').scrollTo({top: el.offsetTop - 10, behavior:'smooth'});
  }
}

// ---OPEN TECH (DETAIL) ---
function openTech(beltId, si, ii) {
  const belt = BELTS.find(b=>b.id===beltId);
  const section = belt.sections[si];
  const tech = section.items[ii];
  navStack.push({type:'tech', beltId, si, ii});
  document.getElementById('header-title').textContent = section.title;
  document.getElementById('header-subtitle').textContent = belt.name;
  document.getElementById('header-subtitle').style.display = 'block';
  document.getElementById('back-btn').style.display = 'block';

  // Video block
  let videoHtml = '';
  if (videoReady(tech.video)) {
    videoHtml = `
      <div class="video-section">
        <div class="video-wrapper">
          <video controls preload="none" playsinline
            onerror="this.closest('.video-wrapper').innerHTML=noVideoHtml('${tech.video}')">
            <source src="video/${tech.video}" type="video/mp4">
          </video>
        </div>
        <div class="video-filename">video/${tech.video}</div>
      </div>
    `;
  }

  // Other techs in same section
  const otherTechs = section.items
    .map((t,i)=>({t,i}))
    .filter(({i})=>i!==ii);

  const html = `
    <div class="detail-view">
      <div class="detail-tech-block">
        <div class="detail-tech-num" style="color:${belt.color}">${tech.n ? 'Tecnica '+tech.n : 'Tecnica'} · ${section.title}</div>
        <div class="detail-tech-title">${tech.name}</div>
        ${videoHtml}
        <div class="detail-tech-desc">${tech.desc}</div>
      </div>
      ${otherTechs.length ? `
        <div class="home-section-title" style="margin-top:8px">Nella stessa sezione</div>
        ${otherTechs.map(({t,i})=>`
          <div class="other-tech-item" onclick="openTech('${beltId}',${si},${i})">
            <div style="flex:1">
              <div style="font-size:14px;font-weight:600">${t.n ? t.n+'. ' : ''}${t.name}</div>
              <div style="font-size:12px;color:var(--text2);margin-top:2px">${t.desc.substring(0,70)}…</div>
            </div>
            ${videoReady(t.video) ? '<div class="video-badge">▶</div>' : ''}
          </div>
        `).join('')}
      ` : ''}
      <div style="height:16px"></div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
  document.getElementById('content').scrollTop = 0;
}

function noVideoHtml(filename) {
  return `<div class="video-placeholder">
    <div class="video-placeholder-icon">🎬</div>
    <div>Video non ancora caricato</div>
    <div class="video-placeholder-file">video/${filename}</div>
  </div>`;
}

// ---BACK ---
function goBack() {
  navStack.pop();
  if (navStack.length===0) {
    if (currentTab==='belts') {
      document.getElementById('back-btn').style.display='none';
      document.getElementById('header-subtitle').style.display='none';
      document.getElementById('header-title').textContent='Cinture';
      renderBelts();
    } else { showTab('home'); }
  } else {
    const prev = navStack[navStack.length-1];
    if (prev.type==='belt') {
      const belt = BELTS.find(b=>b.id===prev.id);
      currentBelt = belt;
      document.getElementById('header-title').textContent=belt.name;
      const sub = document.getElementById('header-subtitle');
      sub.textContent=`${belt.sections.length} sezioni`;
      sub.style.display='block';
      renderSections(belt);
    }
  }
}

// ---SEARCH ---
function renderSearchEmpty() {
  document.getElementById('content').innerHTML=`<div class="no-results" style="padding-top:60px">
    <div style="font-size:36px;margin-bottom:12px">🔍</div>
    Cerca una tecnica, difesa o posizione
  </div>`;
}

function onSearch(query) {
  const q = query.trim().toLowerCase();
  if (!q) { renderSearchEmpty(); return; }
  const results = [];
  BELTS.forEach(belt=>{
    belt.sections.forEach((sec,si)=>{
      sec.items.forEach((item,ii)=>{
        const hay = (item.name+' '+item.desc+' '+sec.title).toLowerCase();
        if (hay.includes(q)) results.push({belt,sec,item,si,ii});
      });
    });
  });
  if (!results.length) {
    document.getElementById('content').innerHTML=`<div class="no-results">Nessun risultato per "<strong>${query}</strong>"</div>`;
    return;
  }
  function highlight(text,q) {
    const idx = text.toLowerCase().indexOf(q);
    if (idx<0) return text.substring(0,80);
    const start = Math.max(0,idx-20);
    const snippet = (start>0?'…':'')+text.substring(start,start+100)+(start+100<text.length?'…':'');
    return snippet.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);
  }
  let html=`<div class="search-results"><div style="font-size:13px;color:var(--text2);margin-bottom:12px">${results.length} risultat${results.length===1?'o':'i'}</div>`;
  results.forEach(r=>{
    html+=`<div class="search-result-item" onclick="openTechFromSearch('${r.belt.id}',${r.si},${r.ii})">
      <div class="sr-belt" style="color:${r.belt.color}">${r.belt.name}</div>
      <div class="sr-section">${r.sec.title}</div>
      <div class="sr-tech">${r.item.n ? r.item.n+'. ' : ''}${r.item.name}</div>
      <div class="sr-snippet">${highlight(r.item.desc,q)}</div>
      ${videoReady(r.item.video) ? '<div class="sr-has-video">▶ Video disponibile</div>' : ''}
    </div>`;
  });
  html+='</div>';
  document.getElementById('content').innerHTML=html;
}

function openTechFromSearch(beltId,si,ii) {
  currentTab='search';
  currentBelt = BELTS.find(b=>b.id===beltId);
  navStack=[{type:'belt',id:beltId}];
  document.getElementById('back-btn').style.display='block';
  openTech(beltId,si,ii);
}

// --- VIDEO MANIFEST ---
let availableVideos = new Set();

function videoReady(filename) {
  if (!filename) return false;
  return availableVideos.has(filename);
}

async function loadVideoManifest() {
  try {
    const res = await fetch('./video/index.json');
    if (res.ok) {
      const list = await res.json();
      availableVideos = new Set(list);
    }
  } catch(e) {
    // No manifest yet, all badges hidden
  }
}

async function init() {
  await loadVideoManifest();
  renderHome();
}

init();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
