<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Krav Maga — Programmi Tecnici</title>
<style>
  :root {
    --belt-yellow: #e8c224;
    --belt-orange: #e8720a;
    --belt-green: #2a8a2a;
    --belt-blue: #1a5fb4;
    --belt-brown: #7a4a1a;
    --bg: #111;
    --bg2: #1a1a1a;
    --bg3: #242424;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f0;
    --text2: #999;
    --radius: 12px;
    --accent: #e8720a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; overscroll-behavior: none; }

  /* LAYOUT */
  #app { display: flex; flex-direction: column; height: 100dvh; }
  #header { flex-shrink: 0; background: var(--bg2); border-bottom: 1px solid var(--border); padding: 12px 16px; position: sticky; top: 0; z-index: 100; }
  #header-top { display: flex; align-items: center; gap: 12px; }
  #back-btn { display: none; background: none; border: none; color: var(--text); padding: 4px 8px 4px 0; font-size: 22px; cursor: pointer; line-height: 1; }
  #header-title { font-size: 17px; font-weight: 600; flex: 1; }
  #header-subtitle { font-size: 12px; color: var(--text2); margin-top: 2px; display: none; }
  #search-bar { margin-top: 10px; display: none; }
  #search-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; color: var(--text); font-size: 15px; outline: none; }
  #search-input::placeholder { color: var(--text2); }
  #content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #bottom-nav { flex-shrink: 0; background: var(--bg2); border-top: 1px solid var(--border); display: flex; padding: 8px 0 max(8px, env(safe-area-inset-bottom)); }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--text2); padding: 4px 0; cursor: pointer; font-size: 10px; transition: color 0.15s; }
  .nav-btn.active { color: var(--accent); }
  .nav-btn svg { width: 24px; height: 24px; }

  /* BELT SELECTOR */
  .belts-grid { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .belt-card { background: var(--bg2); border-radius: var(--radius); border: 1px solid var(--border); padding: 18px 20px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: background 0.15s, border-color 0.15s; text-decoration: none; }
  .belt-card:active { background: var(--bg3); }
  .belt-stripe { width: 6px; height: 56px; border-radius: 3px; flex-shrink: 0; }
  .belt-info { flex: 1; }
  .belt-name { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
  .belt-count { font-size: 13px; color: var(--text2); margin-top: 3px; }
  .belt-arrow { color: var(--text2); font-size: 20px; }

  /* SECTION LIST */
  .sections-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .section-item { background: var(--bg2); border-radius: 10px; border: 1px solid var(--border); cursor: pointer; overflow: hidden; }
  .section-header { padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .section-num { font-size: 12px; font-weight: 700; color: var(--text2); min-width: 28px; font-variant-numeric: tabular-nums; }
  .section-title { flex: 1; font-size: 15px; font-weight: 600; line-height: 1.3; }
  .section-chevron { color: var(--text2); font-size: 18px; transition: transform 0.2s; }
  .section-item.open .section-chevron { transform: rotate(90deg); }
  .section-body { display: none; padding: 0 16px 16px; }
  .section-item.open .section-body { display: block; }
  .tech-item { padding: 10px 12px; background: var(--bg3); border-radius: 8px; margin-top: 8px; }
  .tech-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .tech-desc { font-size: 13px; color: var(--text2); line-height: 1.55; }
  .belt-accent-bar { width: 100%; height: 3px; border-radius: 0 0 var(--radius) var(--radius); flex-shrink: 0; }

  /* SEARCH RESULTS */
  .search-results { padding: 12px 16px; }
  .search-result-item { background: var(--bg2); border-radius: 10px; border: 1px solid var(--border); padding: 14px 16px; margin-bottom: 8px; cursor: pointer; }
  .search-result-item:active { background: var(--bg3); }
  .sr-belt { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .sr-section { font-size: 13px; color: var(--text2); margin-bottom: 3px; }
  .sr-tech { font-size: 15px; font-weight: 600; }
  .sr-snippet { font-size: 13px; color: var(--text2); margin-top: 4px; line-height: 1.4; }
  mark { background: rgba(232,114,10,0.3); color: var(--text); border-radius: 2px; padding: 0 1px; }
  .no-results { text-align: center; padding: 40px 16px; color: var(--text2); font-size: 15px; }

  /* HOME STATS */
  .home-hero { padding: 24px 16px 8px; }
  .home-title { font-size: 28px; font-weight: 800; line-height: 1.1; }
  .home-sub { font-size: 15px; color: var(--text2); margin-top: 6px; }
  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 16px; }
  .stat-card { background: var(--bg2); border-radius: 10px; border: 1px solid var(--border); padding: 14px 12px; text-align: center; }
  .stat-num { font-size: 26px; font-weight: 800; }
  .stat-label { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .home-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text2); padding: 4px 16px 8px; }
  .exam-badge { display: inline-block; background: rgba(232,114,10,0.15); color: var(--accent); border: 1px solid rgba(232,114,10,0.3); border-radius: 6px; font-size: 11px; font-weight: 700; padding: 2px 8px; margin-top: 8px; }

  /* DETAIL VIEW */
  .detail-view { padding: 16px; }
  .detail-tech-block { background: var(--bg2); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; margin-bottom: 12px; }
  .detail-tech-num { font-size: 12px; color: var(--text2); font-weight: 700; margin-bottom: 6px; }
  .detail-tech-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
  .detail-tech-desc { font-size: 14px; color: #ccc; line-height: 1.65; }
  .tip-block { background: rgba(232,114,10,0.08); border: 1px solid rgba(232,114,10,0.2); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .tip-label { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .tip-text { font-size: 13px; color: var(--text2); line-height: 1.5; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-top">
      <button id="back-btn" onclick="goBack()" aria-label="Indietro">&#8249;</button>
      <div style="flex:1">
        <div id="header-title">Krav Maga</div>
        <div id="header-subtitle"></div>
      </div>
    </div>
    <div id="search-bar">
      <input id="search-input" type="search" placeholder="Cerca tecnica, difesa…" oninput="onSearch(this.value)" autocomplete="off" spellcheck="false">
    </div>
  </div>
  <div id="content"></div>
  <div id="bottom-nav">
    <button class="nav-btn active" onclick="showTab('home')" id="tab-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </button>
    <button class="nav-btn" onclick="showTab('belts')" id="tab-belts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      Cinture
    </button>
    <button class="nav-btn" onclick="showTab('search')" id="tab-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Cerca
    </button>
  </div>
</div>

<script>
const BELTS = [
  {
    id: 'gialla',
    name: 'Cintura Gialla',
    color: '#e8c224',
    sections: [
      { title: 'Cadute', items: [
        { n:'1', name:'Capriola in avanti', desc:'Gamba dx in avanti, spalla dx va verso il terreno, braccio opposto va all\'indietro. Rialzarsi in guardia sx e dx.' },
        { n:'2', name:'Caduta all\'indietro con recupero', desc:'Passo indietro, avvicina il sedere al tallone, batti le braccia per scaricare il peso. Tieni la guardia e recupera con capriola all\'indietro. Le gambe passano dove hai il braccio aperto, la testa si inclina dal lato opposto.' }
      ]},
      { title: 'Posizioni', items: [
        { n:'1', name:'Posizione naturale', desc:'Piedi alla stessa altezza, larghi come le spalle, mani lungo le cosce.' },
        { n:'2', name:'Posizione naturale difensiva', desc:'Piedi alla stessa altezza, larghi come le spalle, mani davanti alla faccia a circa 20 cm, appena sotto gli occhi. Gomiti chiusi.' },
        { n:'3', name:'Guardia', desc:'Gambe larghe come le spalle, peso sulla gamba davanti (sx) leggermente chiusa per proteggere i genitali, gamba dx parallela con tallone alzato. Mani con dita chiuse, altezza viso sx a circa 20 cm e dx a circa 10 cm, entrambe appena sotto gli occhi. Spalle chiuse, low profile.' },
        { n:'4', name:'Seconda guardia', desc:'Come la guardia ma la mano davanti scende a proteggere i genitali e l\'altra si sposta più verso il centro.' }
      ]},
      { title: 'Pugni — Posizione Naturale', items: [
        { n:'1', name:'Pugno diretto sx/dx con rotazione dell\'anca', desc:'Mano inclinata come se indicassi, polso a 45°. Il movimento parte dalla rotazione dell\'anca. Non arrivare mai all\'estensione completa. La gamba dal lato del braccio che colpisce ruota alzando il tallone.' }
      ]},
      { title: 'Spostamenti a croce', items: [
        { n:'', name:'Principio base', desc:'Sposta sempre per prima la gamba più vicina alla direzione in cui devi andare, poi recupera e fermati con le gambe alla stessa distanza di partenza. Baricentro leggermente abbassato per maggiore stabilità.' },
        { n:'1', name:'In guardia avanzando', desc:'Spostarsi in avanti mantenendo la guardia.' },
        { n:'2', name:'In guardia indietreggiando', desc:'Spostarsi indietro mantenendo la guardia.' },
        { n:'3', name:'In guardia lateralmente dx e sx', desc:'Spostarsi lateralmente mantenendo la guardia.' }
      ]},
      { title: 'Pugni — In Guardia', items: [
        { n:'1', name:'Pugno diretto sx/dx (3 variazioni di peso)', desc:'Ruota l\'anca e sbilanciati per trovare la distanza del pugno: avanti, sul posto, indietro.' },
        { n:'2', name:'In guardia: spostamenti a croce con pugni diretti', desc:'Combina spostamenti e pugni diretti sx/dx.' }
      ]},
      { title: 'Colpi vari da posizione naturale', items: [
        { n:'1', name:'Colpo di palmo al viso o al mento', desc:'Si colpisce con il palmo lato basso e opposto al pollice (prolungamento dell\'ulna), al mento o alla spina del naso.' },
        { n:'2', name:'Punta delle dita alla fossetta sovrasternale', desc:'Dita leggermente piegate, colpiscono alla fossetta sovrasternale.' },
        { n:'3', name:'Pressione del pollice nell\'occhio', desc:'Entra col pollice nel canale lacrimale.' }
      ]},
      { title: 'Gomitate', items: [
        { n:'1', name:'Frontale', desc:'Aggressore di fronte. Movimento orizzontale, braccio parallelo al terreno. Braccio dx passa dietro alla mano sx che resta in guardia. Il gomito fa da mirino, naso e gomito in linea.' },
        { n:'2', name:'Laterale (lato contrario al braccio che colpisce)', desc:'Aggressore alla mia sx: il piede sx apre verso l\'avversario, colpisco con il braccio dx che passa dietro a mano sx.' },
        { n:'3', name:'Laterale (stesso lato del braccio che colpisce)', desc:'Aggressore a mia sx: colpisco con il braccio sx ruotando il piede dx. Striscio come se mi pulissi il naso.' },
        { n:'4', name:'Frontale: dal basso verso l\'alto', desc:'Aggressore di fronte, colpisco con braccio dx come se mi pettinassi.' },
        { n:'5', name:'Frontale: dall\'alto verso il basso', desc:'Aggressore di fronte piegato, colpisco la cervicale.' },
        { n:'6', name:'Dietro bassa', desc:'Colpisco al fegato (dx) o alla milza (sx).' },
        { n:'7', name:'Dietro dal basso verso l\'alto', desc:'Colpisco al mento.' },
        { n:'8', name:'Dietro alta', desc:'Colpisco al viso, ruoto l\'anca sul posto. Il movimento non deve essere circolare ma una traslazione.' }
      ]},
      { title: 'Pugni a martello', items: [
        { n:'1', name:'Posizione naturale, aggressore di fronte', desc:'Colpisco alla tempia o mandibola sx e dx (senza incrociare) con pugno laterale. Si colpisce tempia, mandibola, collo o clavicola.' },
        { n:'2', name:'Posizione naturale, aggressore mi spinge', desc:'Da spinta vado a protezione con la mano dietro alla nuca per ammortizzare l\'impatto al muro. Uso stesso braccio per colpire aggressore su clavicola dall\'alto verso il basso.' },
        { n:'3', name:'Posizione naturale, aggressore di lato', desc:'Pugno laterale (tipo gomitata 3).' },
        { n:'4', name:'Posizione naturale, aggressore dietro', desc:'Pugno all\'indietro con rotazione (tipo gomitata 8).' },
        { n:'5', name:'Posizione naturale, aggressore dietro dal basso', desc:'Pugno all\'indietro dal basso verso l\'alto (tipo gomitata 7).' },
        { n:'6', name:'In guardia, aggressore di fronte', desc:'Rotazione interna della gamba davanti, ruoto e colpisco con pugno destro.' },
        { n:'7', name:'In guardia, aggressore accucciato davanti', desc:'Pugno a martello dall\'alto verso il basso al cervelletto (come gomitata 5).' }
      ]},
      { title: 'Ginocchiate', items: [
        { n:'1', name:'Frontale — ginocchiata ai genitali', desc:'Entrambe le mani afferrano la stessa spalla per proteggersi da testate. Con le mani tiri verso il basso l\'aggressore. Se afferri spalla sx colpisci con gamba dx.' },
        { n:'2', name:'Laterale — ginocchiata laterale', desc:'Come sopra ma l\'avversario è laterale anziché frontale, la coscia rimane parallela al terreno.' }
      ]},
      { title: 'Calci', items: [
        { n:'1', name:'Calcio frontale — varie altezze', desc:'A) Posizione naturale: calcio frontale sx e dx. B) In guardia. Puoi colpire sia con gamba avanti (più veloce, meno potente) che con gamba dietro (più potente, meno veloce). Piega schiena all\'indietro per aumentare velocità.' },
        { n:'2', name:'Calcio laterale — varie altezze', desc:'Colpisco col bordo del piede o col piatto, apri, carica e colpisci. A) Posizione naturale sx e dx, colpisci con pianta o tallone. B) In guardia sx e dx.' },
        { n:'3', name:'Calcio circolare (gamba dietro) — varie altezze', desc:'Potenza data dalla rotazione del piede a terra (almeno 90°, più ruoti più il calcio è forte). Colpisci sempre con la tibia. La gamba deve essere distesa.' },
        { n:'4', name:'Calcio all\'indietro', desc:'A) Avversario dietro: in base alla distanza, se lontano calcio laterale distante, se vicino calcio del mulo. B) In guardia sx: rotazione oraria e calcio all\'indietro. 5-Frontale con rotazione B: rotazione oraria e calcio all\'indietro.' }
      ]},
      { title: 'Difese da pugno diretto', items: [
        { n:'1', name:'Spostamento laterale con uscita', desc:'In guardia: spostamento del corpo laterale con uscita dal lato in cui arriva il colpo per rimanere esterno e contrattaccare. Pugno diretto all\'addome abbassandosi.' },
        { n:'2', name:'Colpo speculare all\'attacco', desc:'In guardia: colpisci con la mano speculare all\'attacco, uscita laterale e contrattacco. Colpisci al volto con arto speculare rimanendo esterno.' },
        { n:'3', name:'Pugno diretto all\'addome', desc:'In guardia: abbassati, esci lateralmente dalla parte opposta dell\'attacco, sposta sia la testa che la gamba. Colpisci con un pugno diretto all\'addome.' }
      ]},
      { title: 'Parate — 7', items: [
        { n:'', name:'Principio parate', desc:'Posizione naturale: parate a 180° (dalla 1 alla 7) con mano sx e dx. Non esiste parata senza colpo. Avanza con lo stesso piede della parata, anche la parata è un colpo, pugno al viso con l\'altra mano.' }
      ]},
      { title: 'Difese da strangolamento', items: [
        { n:'1A', name:'Frontale statica — ginocchiata', desc:'Afferra con le mani a pappagallo i polsi, ginocchiata ai testicoli inclinando indietro la schiena.' },
        { n:'1B', name:'Frontale statica — colpo al viso', desc:'Passo indietro afferrando la mano dallo stesso lato con cui indietreggi, sfila la spalla passando sotto e colpo di palmo al viso o mano a pappagallo in fossetta sovrasternale.' },
        { n:'1C', name:'Frontale statica — colpo alle orecchie', desc:'Sputo e colpisci simultaneamente entrambe le orecchie con mano aperta.' },
        { n:'2', name:'Da dietro a due mani dinamico', desc:'Afferra le mani dell\'aggressore, passa all\'indietro cercando il contatto con il gluteo su sua gamba esterna, colpisci i genitali, gomitata n.7 al viso, passo in avanti con gamba esterna, calcio all\'indietro con gamba interna poi passo in avanti.' },
        { n:'3', name:'Di lato statica', desc:'Con mano più distante afferra la presa per respirare. Mano più vicina colpisci i genitali, gomitata al mento con stesso lato, passo per allontanarti, calcio ai genitali.' }
      ]},
      { title: 'Shadow boxing', items: [
        { n:'', name:'Shadow boxing completa — 2 minuti', desc:'Combinare i colpi in sequenza in maniera che lo stesso colpo non sia ripetuto più di una volta.' }
      ]},
      { title: 'Combattimento', items: [
        { n:'', name:'Combattimento a contatto leggero', desc:'1 round da 2 minuti.' }
      ]}
    ],
    tips: ['Non esiste parata senza colpo', 'Combina i colpi in sequenza: lo stesso colpo non si ripete due volte di fila']
  },
  {
    id: 'arancio',
    name: 'Cintura Arancione',
    color: '#e8720a',
    sections: [
      { title: 'Cadute', items: [
        { n:'1', name:'Caduta in avanti dura', desc:'Reazione a potenziale esplosione. Buttati per terra atterrando con gli avambracci. Ruota la testa lateralmente. Corpo rigido, posizione di plank.' },
        { n:'2', name:'Caduta laterale con ostacolo', desc:'Caduta laterale con ostacolo presente.' },
        { n:'3', name:'Caduta indietro ruotando e ammortizzando sulle braccia', desc:'Rotazione con ammortizzamento sulle braccia.' }
      ]},
      { title: 'Ganci', items: [
        { n:'1', name:'Posizione naturale: gancio sx e dx', desc:'È la distanza che fa il colpo. Da posizione chiusa, il gomito si alza, avambraccio parallelo al terreno, usa il caricamento dell\'anca, pugno a 45° o verticale.' },
        { n:'2', name:'Posizione naturale: gancio al busto', desc:'Come il gancio 1 ma al busto.' },
        { n:'3', name:'In guardia: gancio sx e dx', desc:'Colpisci col braccio più vicino al corpo, pari alla gamba avanti.' },
        { n:'4', name:'In guardia: gancio al busto', desc:'Doppiando e alternando gancio al viso e al corpo. Colpisci col braccio più vicino, pari alla gamba avanti.' },
        { n:'5', name:'Gancio Luca (aka overhand)', desc:'Da posizione naturale o di guardia, dx e sx.' }
      ]},
      { title: 'Montanti', items: [
        { n:'1', name:'Montante al viso dx e sx', desc:'Unico colpo che va dal basso verso l\'alto. Distanza ravvicinata, avambraccio parallelo allo sterno, la spinta parte dall\'anca. Il gomito rimane appoggiato all\'anca. Da posizione naturale e guardia.' },
        { n:'2', name:'Montante alla bocca dello stomaco dx e sx', desc:'Come il montante al viso ma diretto alla bocca dello stomaco.' }
      ]},
      { title: 'Testate', items: [
        { n:'1', name:'Testata frontale', desc:'Mira il naso. Colpo ravvicinato, porta il mento il più velocemente possibile vicino allo sterno, meno ti muovi nel caricamento meglio è. Si colpisce con l\'osso temporale.' },
        { n:'2', name:'Testata laterale', desc:'Colpisci con l\'osso temporale (linea temporale laterale) "corno". Colpisci tempia e/o zigomo.' }
      ]},
      { title: 'Calci', items: [
        { n:'1', name:'Piede scaccia piede — frontale', desc:'Il piede sx prende il posto del dx e calcio frontale. Dx e sx da posizione naturale.' },
        { n:'2', name:'Piede scaccia piede — laterale', desc:'Il piede sx prende il posto del dx e calcio laterale, parti frontale e gira.' },
        { n:'3', name:'Piede scaccia piede — circolare', desc:'Il piede sx prende il posto del dx e calcio circolare.' },
        { n:'4', name:'Calcio sfonda porta', desc:'Appoggiando il piede al petto dell\'avversario, ideale se l\'avversario è seduto. Uso per aumentare distanza in combattimento.' },
        { n:'5', name:'Calcio circolare con interno o esterno piede (mikazuki geri)', desc:'Colpisci con interno o esterno del piede, sia con gamba avanti che gamba dietro. Funzione: aprire la guardia.' },
        { n:'6', name:'Calcio ad ascia', desc:'Solleva la gamba e scendi perpendicolare al terreno per colpire con il tallone viso o spalla.' },
        { n:'7', name:'Uramawashi dx e sx', desc:'Colpire gamba dietro con tallone.' }
      ]},
      { title: 'Parate in seconda guardia', items: [
        { n:'1', name:'Palmo verso di noi', desc:'Parata 1.' },
        { n:'2', name:'Palmo di lato', desc:'Parata 2.' },
        { n:'3', name:'Palmo verso avversario', desc:'Parata 3.' },
        { n:'4', name:'Braccio teso imbuto alto interno', desc:'Parata 4.' },
        { n:'5', name:'Braccio leggermente piegato, palmo verso l\'esterno', desc:'Parata 5.' },
        { n:'6', name:'Gomito chiuso verso l\'orecchio (accarezzarsi l\'orecchio)', desc:'Da seconda guardia, pugno con mano dx e porta sx in parata. Applicazione su bastone.' },
        { n:'7', name:'Braccio sopra la testa piegato a 90°', desc:'Difesa abbassandosi da calcio circolare alto. Mano dx su inguine, la sx afferra la coscia e spinge. Fai passo avanti con la gamba. La spalla attiva deve andare a protezione del mento.' }
      ]},
      { title: 'Difesa da calcio basso-medio frontale', items: [
        { n:'1', name:'Deviazione con la gamba avanti', desc:'In guardia: devia internamente o esternamente sempre con la gamba davanti.' },
        { n:'2', name:'Stop kick', desc:'Anticipa il calcio dell\'avversario con calcio laterale basso con l\'arco plantare rivolto verso l\'alto (gamba dietro) al collo del piede che sta tirando.' },
        { n:'3', name:'Braccio ad imbuto', desc:'In guardia: il braccio dietro va a protezione dell\'inguine sia interno che esterno al calcio, esci esternamente al calcio (meno pericoloso), colpisci col pugno.' },
        { n:'4', name:'Schiaffetto (dita compatte)', desc:'Posizione naturale: no spostamento dei piedi ma rotazione dell\'anca, parata sempre esterna al calcio, esci esternamente facendo passo avanti con gamba omolaterale, colpisci in base alla distanza.' }
      ]},
      { title: 'Difese da low kick', items: [
        { n:'1', name:'Alzare tibia e parare caviglia', desc:'Alza la tibia e vai a parare su sua caviglia o su suo piede.' },
        { n:'2', name:'Blocco', desc:'Da guardia: piccolo passo in avanti e carica tutto il peso sulla gamba avanti (blocco).' }
      ]},
      { title: 'Difese da prese ai polsi', items: [
        { n:'1', name:'Presa controlaterale (a specchio)', desc:'Piede in corrispondenza del braccio che ti afferra si avvicina al piede dell\'aggressore ruotando esternamente. Tieni il gomito vicino al corpo, rotazione del corpo esterna all\'avversario ruotando la mano con palmo verso il basso, colpisci trachea o naso con avambraccio del lato opposto.' },
        { n:'2', name:'Presa omolaterale', desc:'A) Con l\'altra mano afferra il polso dello sparring, calcia con la gamba esterna, ruota il palmo verso l\'alto, passo avanti esterno e colpisci con avambraccio alla gola. B) Palmo verso il corpo, ruota avambraccio verso l\'esterno, quando espone il gomito colpiscilo con mano libera.' },
        { n:'3', name:'A due mani su una mano', desc:'A) Afferra da sopra il tuo pugno, tira verso l\'alto, appena il pollice supera il polso dell\'aggressore il polso ruota verso l\'esterno, poi pugno a martello. B) Da sotto afferra il pollice controlaterale dell\'aggressore e tiralo verso il basso. Calcio frontale.' },
        { n:'4', name:'Presa a due mani su entrambi i polsi', desc:'Mani aperte, porta i gomiti verso di lui. Una volta divincolato afferra l\'aggressore al collo con entrambi gli avambracci, stringi e ginocchiata ai testicoli.' },
        { n:'5', name:'Presa a due mani su entrambi i polsi da dietro', desc:'Vai indietro col corpo fino al contatto portando polsi avanti. Una volta superato il bacino, i palmi ruotano verso l\'alto e spingi indietro il gluteo mentre spingi verso il basso le braccia per uscire dalla presa. Contrattacco con gomitata 8.' }
      ]},
      { title: 'Difese da strangolamento da dietro con avambraccio', items: [
        { n:'1', name:'Giro e colpo', desc:'Gira, colpisci ai testicoli, allarga la presa con entrambe le mani e torsione della testa e delle anche, sfila, leva. Le mani più possibile lontane dal gomito (momento torcente). Rotazione interna dell\'anca e contemporaneamente colpo ai testicoli, continua la rotazione tenendo l\'avambraccio vicino a sé, ginocchiate al petto e porta a terra con leva al polso con controllo del gomito.' }
      ]},
      { title: 'Difese da strangolamento frontale dinamico', items: [
        { n:'', name:'Strangolamento con spinta', desc:'Passo indietro, con mano omolaterale della gamba dietro blocca la mano dell\'avversario, il braccio si solleva esternamente (indico la luna), metti in leva l\'altra mano con gomito, gomitata (senza mai mollare l\'altra mano), ginocchiata con gamba avanti richiamando gamba dietro. Con spinta: blocco, ruoto, braccio che punta la luna indietro, colpo alle costole.' }
      ]},
      { title: 'Difese da strangolamento da presa in cravatta da dietro', items: [
        { n:'1', name:'Presa in cravatta da dietro (elicottero)', desc:'Posiziona la tua gamba più vicina all\'aggressore dietro di lui, contemporaneamente con mano esterna colpisci i testicoli. A) Pressione sotto naso con medio (prima spingo indietro poi verso il basso). B) Pressione all\'occhio più vicino passando da dietro. C) Afferra barba o basetta. D) Afferra capelli. E) Dito ad amo in bocca lateralmente.' }
      ]},
      { title: 'Difese da strangolamento da presa in cravatta da davanti', items: [
        { n:'2', name:'Fuga', desc:'Afferra con entrambe le mani i polsi che chiudono al collo e in rapida sequenza colpo di palmo ai genitali, gomitata al mento. Con il braccio che ha colpito fatti spazio in avanti.' },
        { n:'2b', name:'Standard', desc:'Afferra con entrambe le mani i polsi che chiudono al collo, con la mano più vicina colpo di palmo ai genitali, gomitata al mento. Uscendo colpo e pressione sul processo popliteo.' },
        { n:'3', name:'Torsione con controllo', desc:'Afferra con entrambe le mani i polsi che chiudono al collo, colpo di palmo ai genitali, gomitata al mento, torsione verso l\'esterno tenendo con entrambe le mani il dorso della mano ed il polso dell\'aggressore sul mio petto.' }
      ]},
      { title: 'Combattimento', items: [
        { n:'', name:'Combattimento a contatto leggero', desc:'2 round da 2 minuti — 30 secondi di riposo.' }
      ]}
    ],
    tips: ['Attenzione a non ruotare eccessivamente nella messa in leva della cravatta', 'Nella presa in cravatta da davanti non esagerare il movimento perché l\'aggressore potrebbe togliere la mano']
  },
  {
    id: 'verde',
    name: 'Cintura Verde',
    color: '#2a8a2a',
    sections: [
      { title: 'Cadute', items: [
        { n:'1', name:'Capriola in avanti scavalcando tre colpitori', desc:'Con rincorsa scavalca tre colpitori e alzarsi in guardia.' },
        { n:'2', name:'Capriola laterale con una mano', desc:'Capriola laterale con una mano dx e sx.' },
        { n:'3', name:'Capriola in avanti rimanendo a terra', desc:'Tipo judo.' }
      ]},
      { title: 'Calci — Acquisizione fluidità', items: [
        { n:'1', name:'Tutti i calci a tutte e 3 le altezze', desc:'Esegui ogni calcio alle tre altezze: tibia, medio, alto.' },
        { n:'2', name:'Calcio frontale con saltello e cambio guardia', desc:'Da distanza ravvicinata, per guadagnare spazio e colpire i testicoli fai un saltello con cambio guardia.' },
        { n:'3', name:'Calcio con rincorsa e sforbiciata', desc:'Da posizione naturale: calcio con rincorsa e sforbiciata.' },
        { n:'4', name:'Calcio frustato', desc:'Colpisci con il collo del piede i testicoli. Puoi colpire con gamba dietro (più potente) o gamba davanti (più veloce).' }
      ]},
      { title: 'Difese da calcio circolare alto', items: [
        { n:'1', name:'Parata in seconda guardia A — accorciando la distanza', desc:'Arriva il calcio, avvicinati alla gamba che sta per colpirti per chiudere la distanza. Con il braccio afferra da sotto la sua gamba, la mano libera va su spalla e fai o soto gari. Una volta a terra tieni il controllo della gamba, fai leva sulla caviglia e gira in posizione prona. Cambia presa sulla caviglia e immobilizza facendo leva sul tendine di achille.' },
        { n:'2', name:'Parata in seconda guardia B — accorciando la distanza', desc:'Arriva il calcio, parata in seconda guardia, afferra la gamba, indietreggia e fai cadere l\'avversario di pancia. Una volta a terra prendi una gamba e piegala su ginocchio nel processo popliteo e immobilizza con l\'altra.' },
        { n:'3', name:'Parata in seconda guardia', desc:'Porta braccio sx a protezione dell\'orecchio e gamba sx alta (gomito e ginocchio si toccano), con l\'altra mano colpisci avanzando.' },
        { n:'4', name:'Parata in seconda guardia — abbassarsi', desc:'Abbassati, mano sx sopra la testa in parata n°7, avanza con gamba dx e ruotando spingi con mano dx all\'interno coscia.' }
      ]},
      { title: 'Difese da calcio circolare medio', items: [
        { n:'1', name:'Parata su coscia e tibia', desc:'In guardia o posizione naturale difensiva: para sulla coscia e sulla tibia con avambracci. Avanza ruotando portando avanti la gamba dal lato opposto (es se aggredisce con dx avanzi con sx), para con avambracci su tibia e coscia, colpi.' },
        { n:'2', name:'Parata braccio ad imbuto, afferra', desc:'Avanza in diagonale, anticipa il colpo, posiziona le braccia a protezione del viso e del fianco con i gomiti che si toccano. Afferra coscia poi: A) porta giù spazzando con o soto gari; B) rotazione nella direzione del calcio; C) tira indietro facendo cadere l\'aggressore.' }
      ]},
      { title: 'Difese da prese al corpo da davanti', items: [
        { n:'1A', name:'Braccia bloccate altezza spalle', desc:'Urlo, morso all\'orecchio o al trapezio. Sposta indietro il bacino, mani si uniscono tipo bagher per colpire i genitali, poi mani vanno sulle spalle, ginocchiata, con leva al gomito porta a terra.' },
        { n:'1B', name:'Braccia bloccate altezza gomiti', desc:'Ginocchiata nei testicoli, sfila una mano e: A) leva alla spina del naso con pollice o medio; B) dita nell\'occhio; C) morso alla spalla; D) presa al mento con spinta.' },
        { n:'1C', name:'Con sollevamento da terra', desc:'Sforbiciata (cavo popliteo con tallone esterno, tibia con piede interno). Colpi vari.' },
        { n:'A', name:'Pollici — pressione canale lacrimale', desc:'Pollici eseguono pressione canale lacrimale, prima spingi indietro e poi in basso.' },
        { n:'B', name:'Rotazione della testa', desc:'Rotazione della testa.' },
        { n:'3A', name:'Risposta A', desc:'Saltello all\'indietro, calcio ai genitali con la gamba davanti e gomitata con il braccio avanti dall\'alto verso il basso.' },
        { n:'3B', name:'Risposta B', desc:'Passo laterale e colpo di avambraccio al viso.' },
        { n:'3C', name:'Risposta C', desc:'Afferrare il viso e torsione del collo (mento gira verso me stesso).' },
        { n:'4', name:'Mani libere, presa corpo', desc:'A) Il bacino si sposta di lato per colpire con palmo della mano ai testicoli. Quando molla colpi vari. B) Afferra le braccia dell\'aggressore, proietta facendo autocaduta. Rotazione con autocaduta e arrivo con la mano nei suoi testicoli. Una volta caduto carica in monta e colpisci.' },
        { n:'5', name:'Presa tipo rugby (braccia libere)', desc:'A) Calcio genitali. B) Colpo di avambraccio. C) Torsione del collo.' },
        { n:'6', name:'Sprawl', desc:'L\'aggressore tenta di afferrarti il bacino. Blocca la sua azione buttandoti indietro e lasciati cadere di peso su di lui afferrandolo.' }
      ]},
      { title: 'Difese da prese al corpo da dietro', items: [
        { n:'1A', name:'Braccia bloccate piedi a terra — colpi ai testicoli', desc:'Colpi ai testicoli con mani bloccate.' },
        { n:'1B', name:'Braccia bloccate piedi a terra — proiezione', desc:'Afferra sue braccia accucciandoti, proiezione d\'anca cadendogli addosso.' },
        { n:'2A', name:'Braccia libere piedi a terra — abbassarsi', desc:'Abbassati, afferra i pantaloni.' },
        { n:'2B', name:'Braccia libere piedi a terra — noccolata', desc:'Afferra la mano più in alto con lo stesso braccio, colpisci con talloni o pestoni sui piedi, noccolata sul dorso della mano. La mano afferra le dita col palmo rivolto verso di te e il pollice in alto, ruotando porta in leva le sue dita verso di lui, porta a terra.' },
        { n:'2C', name:'Braccia libere piedi a terra — kimura', desc:'Afferra braccio controlaterale, calci, colpisci con i talloni, calcio del mulo, poi creando spazio per ruotare il bacino, passa sotto il braccio bloccato con l\'altro braccio ed esegui kimura, porta a terra.' },
        { n:'3', name:'Braccia bloccate sospeso', desc:'Tallonata doppia ai genitali o alle tibie, vai a terra o proiezione.' },
        { n:'4', name:'Braccia libere sospeso', desc:'Porta i piedi in alto e buttati verso il basso ("pendolo"), proietta.' }
      ]},
      { title: 'Difesa da presa al corpo laterale', items: [
        { n:'1', name:'Presa al corpo laterale', desc:'Mano più vicina afferra il braccio, l\'altra colpisce all\'inguine, poi: A) con gomito più vicino, o striscio su sterno o pressione. B) Proietta facendo ostacolo con gamba più vicina.' }
      ]},
      { title: 'Difese da strangolamento da dietro con corda in piedi', items: [
        { n:'', name:'Tecnica con corda', desc:'Blocco spinta avanzando con una gamba. Con mano controlaterale solleva il braccio quel tanto che basta per uscire dalla presa e con la stessa mano colpisci alle costole fluttuanti. (Prosegui con calcio).' }
      ]},
      { title: 'Difese da prese al corpo con una mano — Studio delle leve', items: [
        { n:'1', name:'Mi giro avvicinandomi e colpisco', desc:'Giro (piede dx va a sx), una volta di fronte ginocchiata o colpo all\'inguine con la gamba che non ha ruotato.' },
        { n:'2', name:'Aggressore afferra maglia con una mano', desc:'Blocca sua mano al petto con mano controlaterale, colpisci con mano opposta (serie di colpi, anche ginocchiate). Afferra con mano omolaterale la sua mano, posiziona i pollici nell\'incavo della mano e le dita si chiudono sulle nocche, ruota facendo in modo che lui abbia il palmo esterno ed il mignolo in alto. Prosegui con leva.' }
      ]},
      { title: 'Studio delle leve alla spalla', items: [
        { n:'1', name:'Laterale "da bar" esterna', desc:'Posiziona mano controlaterale sulla sua spalla passando da sotto (dietro), colpo di palmo al viso con mano più lontana, raddoppio della mano sulla spalla e leva. (Una mano tira e l\'altra va in torsione).' },
        { n:'2', name:'Laterale "da bar" interna', desc:'Posiziona mano controlaterale sulla spalla da sopra, colpo di palmo al viso con mano più lontana e leva portando il mio avambraccio su suo braccio (gomiti in linea), esegui rotazione antioraria del braccio.' },
        { n:'3', name:'Frontale', desc:'Braccio omolaterale (dx con dx) entra sul gomito dall\'alto verso il basso, rotazione del braccio e se arrivi afferra la trachea. Spostati con il corpo dietro all\'aggressore.' },
        { n:'4', name:'Waki gatame', desc:'Blocca la sua mano con mano omolaterale e leva dall\'alto verso il basso con mano controlaterale e leva alla spalla (ascella su suo braccio). N.b. rotazione del corpo per non far uscire dalla leva, cedi con le gambe in avanti.' },
        { n:'5', name:'Leva al gomito (ude osae)', desc:'Blocca la sua mano con mano omolaterale e leva dall\'alto verso il basso mettendo in leva il gomito col mio avambraccio, porta a terra.' }
      ]},
      { title: 'Combattimento', items: [
        { n:'', name:'Combattimento a contatto pieno', desc:'3 round da 2 minuti — 1 minuto di recupero.' }
      ]}
    ],
    tips: ['OBIETTIVO: uscire dalla linea di fuoco e tenere il controllo dell\'arma']
  },
  {
    id: 'blu',
    name: 'Cintura Blu',
    color: '#1a5fb4',
    sections: [
      { title: 'Cadute', items: [
        { n:'1', name:'Caduta in avanti dura', desc:'Reazione a potenziale esplosione. Buttati per terra atterrando con gli avambracci. Ruota la testa lateralmente. Corpo rigido, posizione di plank.' },
        { n:'2', name:'Caduta laterale con ostacolo', desc:'Caduta laterale con ostacolo presente.' },
        { n:'3', name:'Caduta indietro ruotando e ammortizzando', desc:'Rotazione con ammortizzamento sulle braccia.' }
      ]},
      { title: 'Proiezioni', items: [
        { n:'1', name:'Spazzata di base (o soto gari)', desc:'Colpo al viso con mano aperta, afferra sua spalla omolaterale. Allinea il piede esterno con suo piede, carica e colpisci con il polpaccio il suo polpaccio, spingendo con la mano la spalla. N.B.: mentre stai per afferrare la spalla dai gomitata al mento per fargli inarcare la schiena. Una volta a terra immobilizza.' },
        { n:'2', name:'Spazzata frontale (ashi barai)', desc:'In combattimento, spazzata con gamba davanti sia interna che esterna.' },
        { n:'3', name:'Proiezione in autocaduta all\'indietro (Tomoe nage)', desc:'Su spinta alla maglia indietreggia sfruttando sua spinta, afferra le sue braccia o maglietta, buttati a terra con caduta all\'indietro, caricalo su una gamba posizionando il piede su suo corpo (inguine o pancia) e spingilo oltre la tua testa. È corretto fare la proiezione laterale.' },
        { n:'4', name:'Sbilanciamento "da discoteca"', desc:'Piede omolaterale aggancia la caviglia dell\'aggressore, esegui pressione con il ginocchio su suo ginocchio (meglio se riesci anche a spingere con la spalla).' }
      ]},
      { title: 'Difesa da tentativo di strangolamento (Koshi guruma)', items: [
        { n:'1', name:'Con presa al collo', desc:'Apri con due mani da interno, con sx afferra sua dx e con dx colpisci suo collo avvolgendolo. Girando rimanendo interno e dandogli le spalle, i piedi all\'interno dei suoi, il braccio avvolto al suo collo. Durante la rotazione abbassati. Carica con bacino lateralmente e ruota, risollevando le gambe ("squat"). Proiezione a terra.' },
        { n:'2', name:'Con presa al busto', desc:'Inizia aprendo dall\'interno. Con sx afferra sua dx, colpo allo stomaco, poi avvolgi il suo busto con il braccio destro avvicinandoti e ruotando per posizionarti davanti di schiena. Nella rotazione abbassati, una volta stabilito il contatto proiettalo sollevandolo, sfruttando la forza delle gambe.' },
        { n:'3', name:'Con presa con entrambe le mani allo stesso braccio', desc:'Apri internamente, gomitata allo stomaco o pugno sul bicipite, una mano afferra il polso, il braccio omolaterale va sotto l\'ascella. Appoggia la schiena su sua pancia abbassandoti. Proietta sollevandoti e ruotando il busto. Tieni sempre il braccio dell\'aggressore mentre lo butti a terra. Immobilizza.' }
      ]},
      { title: 'Difesa da strangolamento con o soto gari', items: [
        { n:'1', name:'Mano su fossetta sovrasternale', desc:'Come la tecnica 14 del programma gialla, la mano sulla fossetta sovrasternale e avanza con la stessa gamba. A differenza della gialla avanzi, non indietreggi.' },
        { n:'2', name:'Manata al mento', desc:'Come la tecnica 14 del programma gialla, la mano sul mento e spingi. Non va fatta proiezione.' }
      ]},
      { title: 'Difese da pugno laterale', items: [
        { n:'1', name:'Difesa da pugno laterale sx', desc:'Gamba dx in avanti, braccio sx in rotazione para (parata da seconda guardia n.6), con l\'altro contrattacca.' },
        { n:'2', name:'Difesa da pugno laterale dx', desc:'Come sopra ma sarai esterno.' }
      ]},
      { title: 'Difese da calcio laterale medio', items: [
        { n:'1', name:'Attacco frontale', desc:'Avanza esterno, parata con braccio ad imbuto, colpisci con gambe o pugni.' },
        { n:'2', name:'Attacco laterale', desc:'Colpisci con il braccio da esterno ad interno (devi deviare), rotazione del busto, calcio al perineo. Para sempre con il braccio dietro.' }
      ]},
      { title: 'Studio del cavaliere', items: [
        { n:'1', name:'Verso l\'alto', desc:'Colpisci sempre con un calcio prima del cavaliere. Usa il peso del corpo. Tieni il suo polso con la sx, con la dx spingi sulle nocche e "scava" nel suo pugno quando allenta la presa per estrarre il coltello.' },
        { n:'2', name:'Normale', desc:'Tecnica standard del cavaliere.' },
        { n:'3', name:'Verso il basso', desc:'Cavaliere verso il basso.' }
      ]},
      { title: 'Difesa da minaccia con coltello', items: [
        { n:'1', name:'Minaccia frontale', desc:'Mani in segno di resa. Se minaccia con mano dx, sposta con la mano dx e calcio con dx.' },
        { n:'2A', name:'Coltello alla gola sul lato — mano prona', desc:'Come da difesa da presa alla maglia: afferra sua mano con coltello con mano speculare bloccandola sul petto (mano a pappagallo). Contemporaneamente colpo al viso, afferra la spalla, ginocchiate, raddoppia con altra mano su coltello e fai leva n.4 (Kote Gaeshi). Porta a terra e immobilizza.' },
        { n:'2B', name:'Coltello alla gola sul lato — mano supina', desc:'Con mano OPPOSTA a quella con cui l\'aggressore tiene il coltello afferra la sua mano armata e spingila verso il basso, ruotando il busto e mantenendo contatto con il fianco. Con il braccio più distante colpisci il viso e torna immediatamente sul coltello, raddoppia la presa, leva 4.' },
        { n:'3A', name:'Coltello alla gola centrale — una mano', desc:'Con mano speculare afferra la sua mano con coltello e spingi verso il basso avvicinandoti lateralmente, colpi al viso etc.' },
        { n:'3B', name:'Coltello alla gola centrale — due mani', desc:'Afferra con due mani la mano che tiene il coltello e bloccala sul petto tirando indietro la testa. Contemporaneamente calcio o ginocchiata (movimento a pendolo).' },
        { n:'4A', name:'Da dietro alla schiena — interna', desc:'Ruota internamente rimanendo a contatto con il braccio dell\'aggressore. Con braccio passa sopra al suo e immobilizza avvicinandoti. Contemporaneamente colpo al volto, afferra la spalla, ginocchiate tenendo sempre focus sul coltello. Quando è ammorbidito fai leva e porta a terra.' },
        { n:'4B', name:'Da dietro alla schiena — esterna', desc:'Ruota esternamente, aggancia suo braccio dx con dx mantenendo il controllo del coltello, colpisci il collo da dietro, afferra testa e falla ruotare dal lato opposto al tuo, mantieni la sua schiena inarcata e il suo braccio dx teso.' },
        { n:'5', name:'Da dietro alla gola', desc:'Come da difesa da strangolamento con avambraccio. Afferra coltello con due mani (stabilizza il baricentro con leggera flessione delle ginocchia e gira un po\' il bacino per creare spazio per colpire i testicoli) e colpisci con mano interna i testicoli ripetutamente. Ruota internamente ed esci dal suo braccio, dai ginocchiata. Tieni sempre il coltello completamente aderente al petto. Leva al polso con coltello/disarmo/porta a terra.' },

let currentTab = 'home';
let currentBelt = null;
let currentSection = null;
let navStack = [];

function getBeltColor(id) {
  return BELTS.find(b => b.id === id)?.color || '#888';
}

function getTotalTechs() {
  return BELTS.reduce((t, b) => t + b.sections.reduce((s, sec) => s + sec.items.length, 0), 0);
}

function showTab(tab) {
  currentTab = tab;
  ['home','belts','search'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
  document.getElementById('search-bar').style.display = tab === 'search' ? 'block' : 'none';
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('header-subtitle').style.display = 'none';
  currentBelt = null;
  currentSection = null;
  navStack = [];

  if (tab === 'home') {
    document.getElementById('header-title').textContent = 'Krav Maga';
    renderHome();
  } else if (tab === 'belts') {
    document.getElementById('header-title').textContent = 'Cinture';
    renderBelts();
  } else if (tab === 'search') {
    document.getElementById('header-title').textContent = 'Cerca';
    renderSearchEmpty();
    setTimeout(() => document.getElementById('search-input').focus(), 100);
  }
}

function renderHome() {
  const total = getTotalTechs();
  const totalSec = BELTS.reduce((t, b) => t + b.sections.length, 0);
  document.getElementById('content').innerHTML = `
    <div class="home-hero">
      <div class="home-title">Programmi<br>Tecnici 2025</div>
      <div class="home-sub">Street Self Defence Method · Krav Maga<br>Mauro Chieregati</div>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" style="color:var(--accent)">${BELTS.length}</div><div class="stat-label">Cinture</div></div>
      <div class="stat-card"><div class="stat-num">${totalSec}</div><div class="stat-label">Sezioni</div></div>
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Tecniche</div></div>
    </div>
    <div class="home-section-title">Programmi</div>
    <div class="belts-grid" style="padding-top:0">
      ${BELTS.map(b => `
        <div class="belt-card" onclick="openBelt('${b.id}')">
          <div class="belt-stripe" style="background:${b.color}"></div>
          <div class="belt-info">
            <div class="belt-name">${b.name}</div>
            <div class="belt-count">${b.sections.length} sezioni · ${b.sections.reduce((t,s)=>t+s.items.length,0)} tecniche</div>
            ${b.id === 'marrone' ? '<div class="exam-badge">Esame avanzato</div>' : ''}
          </div>
          <div class="belt-arrow">›</div>
        </div>
      `).join('')}
    </div>
    <div style="height: 16px"></div>
  `;
}

function renderBelts() {
  document.getElementById('content').innerHTML = `
    <div class="belts-grid">
      ${BELTS.map(b => `
        <div class="belt-card" onclick="openBelt('${b.id}')">
          <div class="belt-stripe" style="background:${b.color}"></div>
          <div class="belt-info">
            <div class="belt-name">${b.name}</div>
            <div class="belt-count">${b.sections.length} sezioni · ${b.sections.reduce((t,s)=>t+s.items.length,0)} tecniche</div>
          </div>
          <div class="belt-arrow">›</div>
        </div>
      `).join('')}
    </div>
  `;
}

function openBelt(beltId) {
  const belt = BELTS.find(b => b.id === beltId);
  if (!belt) return;
  currentBelt = belt;
  navStack = [{ type: 'belt', id: beltId }];
  document.getElementById('back-btn').style.display = 'block';
  document.getElementById('header-title').textContent = belt.name;
  const sub = document.getElementById('header-subtitle');
  sub.textContent = `${belt.sections.length} sezioni`;
  sub.style.display = 'block';
  renderSections(belt);
}

function renderSections(belt) {
  let html = '<div class="sections-list">';
  if (belt.tips && belt.tips.length) {
    html += `<div class="tip-block"><div class="tip-label">⚡ Principi chiave</div>${belt.tips.map(t => `<div class="tip-text">• ${t}</div>`).join('')}</div>`;
  }
  belt.sections.forEach((sec, si) => {
    html += `
      <div class="section-item" id="sec-${si}">
        <div class="section-header" onclick="toggleSection(${si})">
          <div class="section-num">${String(si+1).padStart(2,'0')}</div>
          <div class="section-title">${sec.title}</div>
          <div class="section-chevron">›</div>
        </div>
        <div class="section-body">
          ${sec.items.map((item, ii) => `
            <div class="tech-item" onclick="openTech('${belt.id}', ${si}, ${ii})">
              ${item.n ? `<div class="tech-name">${item.n}. ${item.name}</div>` : `<div class="tech-name">${item.name}</div>`}
              <div class="tech-desc">${item.desc.length > 120 ? item.desc.substring(0,120)+'…' : item.desc}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  });
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function toggleSection(si) {
  const el = document.getElementById('sec-' + si);
  el.classList.toggle('open');
  document.getElementById('content').scrollTo({ top: el.offsetTop - 10, behavior: 'smooth' });
}

function openTech(beltId, sectionIdx, techIdx) {
  const belt = BELTS.find(b => b.id === beltId);
  const section = belt.sections[sectionIdx];
  const tech = section.items[techIdx];
  navStack.push({ type: 'tech', beltId, sectionIdx, techIdx });
  document.getElementById('header-title').textContent = section.title;
  document.getElementById('header-subtitle').textContent = belt.name;
  const html = `
    <div class="detail-view">
      <div class="detail-tech-block">
        <div class="detail-tech-num" style="color:${belt.color}">${tech.n ? 'Tecnica ' + tech.n : 'Tecnica'}</div>
        <div class="detail-tech-title">${tech.name}</div>
        <div class="detail-tech-desc">${tech.desc}</div>
      </div>
      ${section.items.length > 1 ? `
        <div class="home-section-title" style="margin-top:16px">Altre tecniche nella sezione</div>
        ${section.items.filter((_,i) => i !== techIdx).map((other, oi) => {
          const realIdx = section.items.indexOf(other);
          return `<div class="search-result-item" onclick="openTech('${beltId}', ${sectionIdx}, ${realIdx})">
            <div class="tech-name" style="font-size:15px">${other.n ? other.n + '. ' : ''}${other.name}</div>
            <div class="tech-desc" style="font-size:13px;color:var(--text2);margin-top:4px">${other.desc.substring(0,90)}…</div>
          </div>`;
        }).join('')}
      ` : ''}
      <div style="height:16px"></div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
  document.getElementById('content').scrollTop = 0;
}

function goBack() {
  navStack.pop();
  if (navStack.length === 0) {
    if (currentTab === 'belts') {
      document.getElementById('back-btn').style.display = 'none';
      document.getElementById('header-subtitle').style.display = 'none';
      document.getElementById('header-title').textContent = 'Cinture';
      renderBelts();
    } else {
      showTab('home');
    }
  } else {
    const prev = navStack[navStack.length - 1];
    if (prev.type === 'belt') {
      const belt = BELTS.find(b => b.id === prev.id);
      currentBelt = belt;
      document.getElementById('header-title').textContent = belt.name;
      const sub = document.getElementById('header-subtitle');
      sub.textContent = `${belt.sections.length} sezioni`;
      sub.style.display = 'block';
      renderSections(belt);
    }
  }
}

function renderSearchEmpty() {
  document.getElementById('content').innerHTML = `<div class="no-results" style="padding-top:60px">
    <div style="font-size:36px;margin-bottom:12px">🔍</div>
    Cerca una tecnica, difesa o posizione
  </div>`;
}

function onSearch(query) {
  const q = query.trim().toLowerCase();
  if (!q) { renderSearchEmpty(); return; }
  const results = [];
  BELTS.forEach(belt => {
    belt.sections.forEach((sec, si) => {
      sec.items.forEach((item, ii) => {
        const haystack = (item.name + ' ' + item.desc + ' ' + sec.title).toLowerCase();
        if (haystack.includes(q)) {
          results.push({ belt, sec, item, si, ii });
        }
      });
    });
  });
  if (!results.length) {
    document.getElementById('content').innerHTML = `<div class="no-results">Nessun risultato per "<strong>${query}</strong>"</div>`;
    return;
  }
  function highlight(text, q) {
    const idx = text.toLowerCase().indexOf(q);
    if (idx < 0) return text.substring(0, 80);
    const start = Math.max(0, idx - 20);
    const snippet = (start > 0 ? '…' : '') + text.substring(start, start + 100) + (start + 100 < text.length ? '…' : '');
    return snippet.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
  }
  let html = `<div class="search-results"><div style="font-size:13px;color:var(--text2);margin-bottom:12px">${results.length} risultat${results.length === 1 ? 'o' : 'i'}</div>`;
  results.forEach(r => {
    html += `<div class="search-result-item" onclick="openTechFromSearch('${r.belt.id}', ${r.si}, ${r.ii})">
      <div class="sr-belt" style="color:${r.belt.color}">${r.belt.name}</div>
      <div class="sr-section">${r.sec.title}</div>
      <div class="sr-tech">${r.item.n ? r.item.n + '. ' : ''}${r.item.name}</div>
      <div class="sr-snippet">${highlight(r.item.desc, q)}</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function openTechFromSearch(beltId, si, ii) {
  currentTab = 'search';
  currentBelt = BELTS.find(b => b.id === beltId);
  navStack = [{ type: 'belt', id: beltId }];
  document.getElementById('back-btn').style.display = 'block';
  openTech(beltId, si, ii);
}

renderHome();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
