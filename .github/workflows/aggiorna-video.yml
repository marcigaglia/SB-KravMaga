name: Aggiorna indice video

on:
  push:
    paths:
      - 'video/**.mp4'   # si attiva solo quando carichi/rimuovi un .mp4

jobs:
  genera-indice:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Genera video/index.json
        run: python3 genera_index_video.py

      - name: Salva video/index.json nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video/index.json
          git diff --staged --quiet || git commit -m "Aggiorna indice video"
          git push
